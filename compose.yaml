services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: genshin-discord-bot:local
    restart: unless-stopped
    init: true
    volumes:
      - ./config.py:/app/config.py:ro
      # PaddleOCRのモデルを保持し、再起動時の再ダウンロードを防ぐ。
      - paddle-cache:/root/.paddlex
      - paddle-data:/root/.paddleocr
      - artifacter-cache:/root/.cache/artifacter-image-gen
      - bot-data:/app/data
    environment:
      TZ: Asia/Tokyo
      OCTAVIA_API_URL: https://octavia.ericha.dev
      ARTIFACTER_IMAGE_GEN_CACHE_DIR: /root/.cache/artifacter-image-gen

volumes:
  paddle-cache:
  paddle-data:
  artifacter-cache:
  bot-data:
